[project]
name = "aioimaplib"
version = "2.0.3"
description = "Python asyncio IMAP4rev1 client library"
authors = [{ name = "Bruno THOMAS", email = "bthomas@iroco.fr" }]
license = "GPL-3.0-only"
readme = "README.rst"
requires-python = ">=3.10,<4.0"
keywords = ["asyncio", "mail", "imap"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
    "Topic :: Internet"
]

[project.urls]
Repository = "https://github.com/iroco-co/aioimaplib"

[project.scripts]
imap-testing-server = "aioimaplib.imap_testing_server:main"

[tool.poetry]
packages = [{include = "aioimaplib"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-rerunfailures = "^15.0"
pytz = "^2024"
tzlocal = "^5.2"
imaplib2 = "3.6"
docutils = "^0.21"
pyOpenSSL = "^24.3"
httpx-oauth = "^0.16"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
